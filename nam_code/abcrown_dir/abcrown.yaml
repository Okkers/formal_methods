general:
  device: cuda
  loss_reduction_func: min
  root_path: /home/martin/PycharmProjects/formal_methods/nam_code/abcrown_dir
  csv_name: instances.csv
  graph_optimizer: Customized('custom_graph_optimizer', 'merge_sign')
  sparse_interm: false
  save_adv_example: true
model:
  input_shape: [1, 30]
  onnx_loader: Customized('custom_model_loader', 'customized_my_loader')
attack:
  pgd_order: before
  pgd_restarts: 2
  pgd_batch_size: 2
  cex_path: ./cex.txt
solver:
  batch_size: 1
  min_batch_size_ratio: 1
  alpha-crown:
    disable_optimization: ['MaxPool']
  beta-crown:
    iteration: 20
    lr_beta: 0.03
  mip:
    parallel_solvers: 8
    solver_threads: 4
    refine_neuron_time_percentage: 0.8
    skip_unsafe: True
bab:
  timeout: 45.0
  pruning_in_iteration: False
  sort_domain_interval: 1
  branching:
    method: nonlinear
    candidates: 3
    nonlinear_split:
      num_branches: 2
      method: shortcut
      filter: true
